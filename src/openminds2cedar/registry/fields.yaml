# Controlled term fields - specify term_class for vocabulary lookup
# Text/link fields don't need config - handled by default

controlled_terms:
  species: controlled_terms.Species
  biologicalSex: controlled_terms.BiologicalSex
  ageCategory: controlled_terms.AgeCategory
  handedness: controlled_terms.Handedness
  strain: controlled_terms.Strain
  phenotype: controlled_terms.Phenotype
  disease: controlled_terms.Disease
  diseaseModel: controlled_terms.DiseaseModel
