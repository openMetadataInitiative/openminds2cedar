# Declarative template definitions
# Each template combines multiple schema elements
# Use 'multiple: true' to allow repeated entries (default: false)
# 'name' field is used for CEDAR template naming (defaults to registry key)

templates:
  subject-study:
    name: "1subject-Nstates"
    description: "Template for subject-based studies with multiple states"
    elements:
      - schema: core.Subject
        multiple: false
      - schema: core.SubjectState
        multiple: true

  tissue-sample-study:
    name: "1tissuesample-Nstates"
    description: "Template for tissue sample studies with multiple states"
    elements:
      - schema: core.TissueSample
        multiple: false
      - schema: core.TissueSampleState
        multiple: true

  dataset-metadata:
    name: "1dataset-Nversions-Npersons"
    description: "Template for dataset metadata with multiple versions and authors"
    elements:
      - schema: core.Dataset
        multiple: false
      - schema: core.DatasetVersion
        multiple: true
      - schema: core.Person
        multiple: true
