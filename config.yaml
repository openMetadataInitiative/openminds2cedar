# openMINDS to CEDAR Element Converter Configuration

# CEDAR Workbench settings
cedar:
  version: "1.6.0"

  # API configuration (requires CEDAR_API_KEY environment variable)
  api:
    base_url: "https://resource.metadatacenter.org"
    timeout: 30  # seconds

    # CEDAR folder ID where elements will be uploaded
    # Find this in CEDAR Workbench URL when viewing a folder
    # Example: https://cedar.metadatacenter.org/dashboard?folderId=https:%2F%2Frepo.metadatacenter.org%2Ffolders%2F...
    # Set to null to use default workspace root
    folder_id: "https://repo.metadatacenter.org/folders/7e5a2000-abf9-4f24-b340-d939ea1625bb"

    # Element metadata
    element_metadata:
      status: "bibo:draft"  # or "bibo:published"
      version: "0.0.1"

# openMINDS schema source (git submodule)
openminds:
  # Local path to openMINDS_JSON-Schema submodule
  submodule_path: "external/openMINDS_JSON-Schema"

  # Schema version to use (latest, v4.0, v3.0, v2.0, v1.0)
  version: "latest"

  # Schema categories and specific schemas to convert
  schemas:
    # Core schemas (actors, research, products, etc.)
    core:
      actors:
        - person.schema.json
        # - organization.schema.json
        # - consortium.schema.json
        # - affiliation.schema.json
        # - contribution.schema.json
        # - contactInformation.schema.json
        # - accountInformation.schema.json

      research:
        - subject.schema.json
        # - subjectState.schema.json
        # - subjectGroup.schema.json
        # - subjectGroupState.schema.json
        # - tissueSample.schema.json
        # - tissueSampleState.schema.json
        # - tissueSampleCollection.schema.json
        # - tissueSampleCollectionState.schema.json
        # - strain.schema.json
        # - protocol.schema.json
        # - protocolExecution.schema.json
        # - behavioralProtocol.schema.json

      products:
        - dataset.schema.json
        # - datasetVersion.schema.json
        # - model.schema.json
        # - modelVersion.schema.json
        # - software.schema.json
        # - softwareVersion.schema.json
        # - metaDataModel.schema.json
        # - metaDataModelVersion.schema.json
        # - project.schema.json

    # Controlled terms (optional - uncomment to include)
    # controlledTerms:
    #   - biologicalSex.schema.json
    #   - species.schema.json

    # Other modules (uncomment as needed)
    # chemicals: []
    # computation: []
    # ephys: []
    # publications: []
    # SANDS: []
    # specimenPrep: []
    # stimulation: []

# Directories
directories:
  # Output directory for generated CEDAR elements
  output: "output/cedar_elements"

  # Backup directory for uploaded elements
  backup: "output/backups"

# Ontology mappings for specific fields
ontology_mappings:
  biologicalSex:
    source: "Phenotype And Trait Ontology (PATO)"
    acronym: "PATO"
    uri: "http://purl.obolibrary.org/obo/PATO_0000047"
    name: "biological sex"
    maxDepth: 0

  species:
    acronym: "NCBITAXON"
    name: "NCBI Taxonomy"
    uri: "https://data.bioontology.org/ontologies/NCBITAXON"

  # Add more custom ontology mappings here
  # fieldName:
  #   acronym: "ONTO"
  #   name: "Ontology Name"
  #   uri: "http://ontology.org/uri"

# Conversion options
conversion:
  # Skip schemas that fail validation
  skip_invalid: true

  # Generate backup before uploading
  backup_before_upload: true

  # Verbose output
  verbose: false

  # Include field descriptions from openMINDS
  include_descriptions: true

  # Field naming convention (preserve, camelCase, snake_case, PascalCase)
  field_naming: "preserve"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/converter.log"
  console: true
