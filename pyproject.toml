[project]
name = "openminds2cedar"
version = "0.1.0"
description = "Generate CEDAR template elements from openMINDS schemas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openminds>=0.4.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.scripts]
openminds2cedar = "openminds2cedar.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
